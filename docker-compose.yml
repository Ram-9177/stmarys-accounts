# Local development databases only (run the API and web app with npm).
#   docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stmarys
      POSTGRES_PASSWORD: stmarys
      POSTGRES_DB: stmarys_dev
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
volumes:
  pgdata:
